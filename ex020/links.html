<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:active {
            color: yellow;
        }

        a::before {
            content: '→ ';
            text-decoration: none;
            font-weight: normal;
        }
        
        a::after {
            content: ' ← ';
            text-decoration: none;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li>
            <a href="https://gustavoguanabara.github.io" target="_blank" rel="nofollow">Repositório do GitHub</a>
        </li>
        <li>
            <a href="https://www.youtube.com/c/CursoemVídeo" target="_blank" rel="nofollow">Canal do Youtube</a>
        </li>
        <li>
            <a href="https://www.cursoemvideo.com/" target="_blank" rel="nofollow">Site do CursoemVideo</a>
        </li>
    </ul>
</body>
</html>
