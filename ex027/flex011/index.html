<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightcoral;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightcyan;
            border: 1px solid black;
            text-align: center;
            flex-basis: 50px;
        }

        div#cxA, div#cxD {
            flex-shrink: 1;
            flex-grow: 0;
        }

        div#cxB, div#cxE {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxC, div#cxG {
            flex-shrink: 0;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">Outro conteúdo</div>
        <div class="item" id="cxC">C</div>
        <div class="item" id="cxD">Conteúdo um pouco maior</div>
        <div class="item" id="cxE">E</div>
        <div class="item" id="cxF">Conteúdo maior ainda, que vai ocupar mais espaço</div>
        <div class="item" id="cxG">G</div>
    </div>
</body>
</html>
